# ─────────────────────────────────────────
#  THEME: cathedral night
#  gothic silence, candlelight, stained glass
# ─────────────────────────────────────────

font-family = JetBrainsMono Nerd Font
font-size = 13.5
font-feature = +calt
font-feature = +liga
font-thicken = true

cursor-style = block
cursor-style-blink = true
cursor-color = #ffd700
cursor-opacity = 1.0

background = #0a070d
foreground = #e8dcc8

# black → deep nave shadow
palette = 0=#140f18
palette = 8=#2a1f30
# red → stained glass ruby
palette = 1=#a83232
palette = 9=#d04a4a
# green → aged oxidized metal
palette = 2=#3f7a5c
palette = 10=#5fa87c
# yellow → candle gold
palette = 3=#d4a63a
palette = 11=#ffd36a
# blue → stained glass sapphire
palette = 4=#3a5f8a
palette = 12=#6a8fc0
# magenta → royal violet cloth
palette = 5=#6a3a8a
palette = 13=#9a60c0
# cyan → faint holy glow
palette = 6=#4a8a8a
palette = 14=#7ac0c0
# white → warm parchment
palette = 7=#cfc2a8
palette = 15=#fff6e8

selection-background = #2a1f30
selection-foreground = #fff6e8

background-opacity = 0.90
background-blur = 18

window-padding-x = 16
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
window-theme = dark
window-colorspace = display-p3

minimum-contrast = 1.2
unfocused-split-opacity = 0.7
alpha-blending = linear-corrected
